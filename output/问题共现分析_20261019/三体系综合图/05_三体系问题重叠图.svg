  <g id="axes_2">
   <g id="text_18">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #193348" x="888.48" y="196.45038" transform="rotate(-0 888.48 196.45038)">先区分两种“重叠”</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #193348" x="888.48" y="255.942525" transform="rotate(-0 888.48 255.942525)">按至少检出1篇：</text>
   </g>
   <g id="text_20">
    <text style="font-size: 15px; font-family: 'Microsoft YaHei'; fill: #087f8c" transform="translate(888.48 294.86016)">18类主题</text>
    <text style="font-size: 15px; font-family: 'Microsoft YaHei'; fill: #087f8c" transform="translate(888.48 320.480863)">三体系均有提及</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #536b7b" transform="translate(888.48 373.257981)">多硫化物溶解/穿梭</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #536b7b" transform="translate(888.48 392.827747)">只在两类锂硫中检出；</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #536b7b" transform="translate(888.48 412.437942)">固态锂金属为0篇。</text>
   </g>
   <g id="text_22">
    <text style="font-weight: 700; font-size: 12px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #193348" x="888.48" y="488.22135" transform="rotate(-0 888.48 488.22135)">主图按“较常关注”：</text>
   </g>
   <g id="text_23">
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #536b7b" transform="translate(888.48 528.727255)">组内提及率 ≥ 5%</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #536b7b" transform="translate(888.48 549.517772)">且命中 ≥ 5篇。</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #536b7b" transform="translate(888.48 570.357704)">圆外只表示未达门槛，</text>
    <text style="font-size: 11.5px; font-family: 'Microsoft YaHei'; fill: #536b7b" transform="translate(888.48 591.198534)">不表示没有该问题。</text>
   </g>
  </g>
  <g id="text_24">
   <text style="font-weight: 700; font-size: 22px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #193348" x="7.2" y="25.645625" transform="rotate(-0 7.2 25.645625)">三体系的问题关注在哪里重叠？</text>
  </g>
  <g id="text_25">
   <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #536b7b" x="7.2" y="62.513125" transform="rotate(-0 7.2 62.513125)">2023—2026年摘要；固态锂硫 n=289，液态锂硫 n=3,109，固态锂金属 n=2,440。</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #536b7b" x="7.2" y="820.9728" transform="rotate(-0 7.2 820.9728)">三组均未达5%门槛：空气/水稳定性（固态锂硫1.0%、液态锂硫0.1%、固态锂金属2.7%）。</text>
  </g>
  <g id="text_27">
   <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #536b7b" x="7.2" y="848.6208" transform="rotate(-0 7.2 848.6208)">集合表示主题类别，不是论文集合；圆面积不编码数量。副反应在液态锂硫为4.7%，接近门槛，不能解释成“没有”。</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10.5px; font-family: 'Microsoft YaHei'; text-anchor: start; fill: #536b7b" x="7.2" y="873.504" transform="rotate(-0 7.2 873.504)">阈值仅帮助阅读关注分布；1%、3%、5%、10%的归类对照随图提供。主题含机制问题及工况/工程约束。</text>
  </g>
