<text x="49" y="748.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">明确目标配置、前提与证据</text>
<text x="49" y="775.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">固态锂硫已有应用及反例</text>
<rect x="356" y="691" width="450" height="115" fill="#F2F7FA" stroke="#236586"/>
<text x="372" y="717.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">05  适用性判定与组合假设</text>
<text x="372" y="745.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">匹配 → 复用；不匹配 → 改造/不适用</text>
<text x="372" y="768.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">不足 → 未知；互补/限制另建组合假设</text>
<text x="372" y="791.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">输出：可检验假设及候选实验设计</text>
<rect x="826" y="691" width="538" height="115" fill="#FFF9F1" stroke="#D8C5A9"/>
<text x="840" y="720.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">尚未形成经核验的正式适用性结论。</text>
<text x="840" y="748.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">相同材料不保证相同效果；功能类比仍是假设。</text>
<text x="840" y="776.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">性能改善证据与机制证据分开，避免因果过推。</text>
