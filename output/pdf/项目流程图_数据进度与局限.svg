<text x="49" y="883.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">基线及策略组、独立重复</text>
<text x="49" y="910.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">预设指标、尺度和机制表征</text>
<rect x="356" y="826" width="450" height="115" fill="#F2F7FA" stroke="#236586"/>
<text x="372" y="852.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">06  实验验证与结论</text>
<text x="372" y="880.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">复用：2组；改造：3组</text>
<text x="372" y="903.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">可独立操控的组合：2×2四组</text>
<text x="372" y="926.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">输出：效果、交互及机制支持程度</text>
<rect x="826" y="826" width="538" height="115" fill="#FFF9F1" stroke="#D8C5A9"/>
<text x="840" y="855.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">待候选比较与实验能力确认；文档未报告完成。</text>
<text x="840" y="883.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">组合交互需重复与不确定性，不能只看单次结果。</text>
<text x="840" y="911.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">负交互不直接证明化学冲突；结论限定目标配置。</text>
