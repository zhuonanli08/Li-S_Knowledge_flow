<text x="372" y="312.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">02  摘要标注与描述统计</text>
<text x="372" y="340.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">标注 → 独立核验 → 全量统计</text>
<text x="372" y="363.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">按体系、时段汇总论文级比例</text>
<text x="372" y="386.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">输出：问题关注与策略使用分布图</text>
<rect x="826" y="286" width="538" height="115" fill="#FFF9F1" stroke="#D8C5A9"/>
<text x="840" y="315.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">已完成首批60篇试点；不代表全量标注已完成。</text>
<text x="840" y="343.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">文档缺摘要约23%–37%；旧分组仍待核查。</text>
<text x="840" y="371.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">摘要未提及 ≠ 不存在；三组非完整四格因子设计。</text>
