<text x="372" y="610.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">样品 → 测试 → 比较（实测观察）</text>
<text x="372" y="633.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">策略页记录作者解释与作用前提</text>
