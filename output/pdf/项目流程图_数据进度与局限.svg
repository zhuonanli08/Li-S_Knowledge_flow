<text x="372" y="177.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">01  语料与分组核查</text>
<text x="372" y="205.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">核对三体系边界与主统计纳入条件</text>
<text x="372" y="228.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">支撑研究、含液/凝胶、待核实单列</text>
<text x="372" y="251.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">输出：可追溯论文表与纳排记录</text>
<rect x="826" y="151" width="538" height="115" fill="#FFF9F1" stroke="#D8C5A9"/>
<text x="840" y="180.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">待完成：随机60篇核查及定向排查，提交复核。</text>
<text x="840" y="208.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">旧组名不能直接等同于方案D的新边界。</text>
<text x="840" y="236.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">随机与定向样本分开报告；组内核查不估计漏收。</text>
