<text x="840" y="613.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">44行“需人看”；原句匹配不等于科学判断正确。</text>
<text x="840" y="641.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">条件缺失记未知；原文数值/单位冲突保留待核。</text>
