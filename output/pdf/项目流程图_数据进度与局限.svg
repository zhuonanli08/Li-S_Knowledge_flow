<text x="372" y="447.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">03  候选问题筛选</text>
<text x="372" y="475.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">逐项说明选择理由，不计算总分</text>
<text x="372" y="498.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">聚焦正极—电解质相关的具体问题</text>
<text x="372" y="521.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">输出：主问题及进入深读的候选清单</text>
