<text x="49" y="478.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">目标体系需求、已有应用证据</text>
<text x="49" y="505.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">全文可得性及实验室能力</text>
