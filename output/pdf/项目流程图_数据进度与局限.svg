<text x="51" y="998.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#287768">当前优先顺序</text>
<text x="215" y="998.08" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#203448">固定词表与表结构 → 分组核查 + 现有5篇回填 → 提交复核 → 再做批2与候选比较。</text>
<text x="215" y="1027.08" font-family="Microsoft YaHei, sans-serif" font-size="16" font-weight="400" fill="#203448">全文约30篇、实验1–3个均是工作量规划，不是已经完成的样本量或结果。</text>
<text x="36" y="1091.44" font-family="Microsoft YaHei, sans-serif" font-size="13" font-weight="400" fill="#596773">阅读提示：左列是输入，中列是处理及产出，右列是证据边界。历史引用分析不进入方案D主线。</text>
