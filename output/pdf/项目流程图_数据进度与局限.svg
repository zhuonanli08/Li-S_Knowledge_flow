<text x="840" y="450.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">待定：第二层主问题与主实验。</text>
<text x="840" y="478.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">关注度差异不能直接证明空白或实验价值。</text>
<text x="840" y="506.2" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="400" fill="#203448">不预设导电碳包覆优先；H01仅为试点候选。</text>
