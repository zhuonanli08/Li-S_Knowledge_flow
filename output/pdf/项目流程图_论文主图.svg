<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="47.0" font-family="Microsoft YaHei, sans-serif" font-size="25" font-weight="700" fill="#203448">三体系设计经验的复用、改造与组合：研究流程</text>
<text x="40" y="78.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#596773">研究对象：以固态锂硫为目标，比较非硫固态与液态锂硫的相关设计经验</text>
<rect x="40" y="104" width="300" height="102" fill="#F2F7FA" stroke="#236586"/>
<text x="56" y="130.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">非硫固态</text>
<text x="56" y="158.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">固态电解质 + 非硫正极</text>
<text x="56" y="181.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">固态界面、传输、力学与加工</text>
<rect x="350" y="104" width="300" height="102" fill="#F2F7FA" stroke="#236586"/>
<text x="366" y="130.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">固态锂硫</text>
<text x="366" y="158.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">固态电解质 + 硫基正极</text>
<text x="366" y="181.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">目标体系；核实最终液相状态</text>
<rect x="660" y="104" width="300" height="102" fill="#F2F7FA" stroke="#236586"/>
<text x="676" y="130.96" font-family="Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#236586">液态锂硫</text>
<text x="676" y="158.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">液态电解液 + 硫基正极</text>
<text x="676" y="181.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">硫反应、物种调控与电极设计</text>
