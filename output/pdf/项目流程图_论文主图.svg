<text x="196" y="670.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">样品 → 测试 → 对照比较；区分实测观察、作者解释与新假设</text>
<text x="196" y="693.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">判定单位：具体策略实现 × 明确的固态锂硫目标配置</text>
<text x="196" y="716.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">材料/局部界面相近，或功能需求相近；逐项核对关键条件</text>
