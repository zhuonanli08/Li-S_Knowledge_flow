<text x="196" y="422.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">标注问题、策略、角色与位置；经独立人工验证后开展全量统计</text>
<text x="196" y="445.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">按体系和时段比较比例与不确定性，形成问题/策略分布图</text>
