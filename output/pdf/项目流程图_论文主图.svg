<text x="196" y="546.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">综合目标需求、两侧策略、已有证据、数据可得性与实验可区分性</text>
<text x="196" y="569.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">选定主问题；全文范围聚焦正极、电解质及其相互作用界面</text>
