<text x="40" y="1040.56" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#596773">注：三组比较用于描述，不分离固态与硫的因果效应；相似策略不等于已发生知识迁移。</text>
<text x="40" y="1060.56" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#596773">组合实验以策略能独立操控为前提；图示为研究设计，不表示所有阶段已完成。</text>
<text x="40" y="1080.56" font-family="Microsoft YaHei, sans-serif" font-size="12" font-weight="400" fill="#916126">证据不足：记适用性未知并补证据；明确不适用：不进入当前配置的实验验证。</text>
