<text x="196" y="298.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">记录检索范围、日期、去重、文献类型及分组依据</text>
<text x="196" y="321.32" font-family="Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#203448">核实主统计纳入条件；单列支撑研究、含液/凝胶与待核实记录</text>
